name: hotel_booking
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  device_preview_plus: ^2.4.3
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_easyloading: ^3.0.5
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  geocoding: ^4.0.0
